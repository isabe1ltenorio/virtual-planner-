server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy da API. Com ele o navegador ve front e backend na MESMA origem, e
    # entao: nao ha preflight de CORS, e o cookie de sessao deixa de ser
    # cross-site — o que importa porque ele e SameSite=Strict e simplesmente
    # nao viajaria entre :8081 e :8080.
    #
    # O nome `api` e o do servico no docker-compose.yml, resolvido pela rede
    # interna do compose. Fora do compose este bloco nao atrapalha: sem o
    # servico, o nginx responde 502 e o front cai no erro de rede do cliente.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # O app usa react-router: uma rota como /goals so existe no cliente. Sem o
    # fallback, recarregar a pagina nessa URL daria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets do Vite tem hash no nome, entao podem ser cacheados por muito
    # tempo. O index.html nao pode: e ele que aponta para o hash novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
