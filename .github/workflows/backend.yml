name: Backend CI

on:
  # push so em main: em branch de PR o gatilho pull_request ja cobre, e ter os
  # dois sem filtro de branch faz o mesmo commit rodar duas vezes (ver #76).
  # Aqui o desperdicio e maior que no frontend, porque o job de integracao
  # compila o libpqxx a partir do codigo-fonte.
  push:
    branches:
      - main
    paths:
      - "back-end/**"
      - "scripts/db-migrate.sh"
      - "scripts/smoke-api.py"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "back-end/**"
      - "scripts/db-migrate.sh"
      - "scripts/smoke-api.py"
      - ".github/workflows/backend.yml"

jobs:
  build-and-test:
    name: Build and test (Debug + Release, sem PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Debug primeiro: build padrão sem otimizações.
      - name: Configure (Debug)
        run: cmake -S back-end -B back-end/build-debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        run: cmake --build back-end/build-debug

      - name: Test (Debug)
        run: ctest --test-dir back-end/build-debug --output-on-failure

      # Release é essencial: com NDEBUG, asserts somem e alguns bugs só
      # aparecem aqui. Nunca pular este passo.
      - name: Configure (Release)
        run: cmake -S back-end -B back-end/build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build back-end/build-release

      - name: Test (Release)
        run: ctest --test-dir back-end/build-release --output-on-failure

  json-and-http:
    name: Build and test com JSON e HTTP
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # O build padrão é offline e não compila nem a serialização compartilhada
      # (P-29.0) nem o servidor (P-28): as duas dependem de bibliotecas baixadas
      # por FetchContent. Sem este job, `shared_json_test` e `api_server_test`
      # nunca rodariam no CI.
      #
      # As duas configurações rodam no mesmo runner, como o job Debug+Release
      # acima faz.

      # JSON sozinho prova que cmake/json.cmake não depende de http.cmake —
      # é a configuração que P-29.1 a P-29.4 usam.
      - name: Configure (Release, só JSON)
        run: >
          cmake -S back-end -B back-end/build-json
          -DCMAKE_BUILD_TYPE=Release
          -DVIRTUAL_PLANNER_WITH_JSON=ON

      - name: Build (só JSON)
        run: cmake --build back-end/build-json

      - name: Test (só JSON)
        run: ctest --test-dir back-end/build-json --output-on-failure

      # HTTP liga JSON junto e acrescenta o servidor. `api_server_test` abre
      # uma porta efêmera em 127.0.0.1 e fala HTTP de verdade com ela.
      - name: Configure (Release, com HTTP)
        run: >
          cmake -S back-end -B back-end/build-http
          -DCMAKE_BUILD_TYPE=Release
          -DVIRTUAL_PLANNER_WITH_HTTP=ON

      - name: Build (com HTTP)
        run: cmake --build back-end/build-http

      - name: Test (com HTTP)
        run: ctest --test-dir back-end/build-http --output-on-failure

  coverage:
    name: Cobertura de testes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      # Com HTTP ligado para que api/http e api/json entrem na medicao. Sem
      # isso a cobertura ignoraria toda a camada de fronteira.
      - name: Configure (com cobertura)
        run: >
          cmake -S back-end -B back-end/build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DVIRTUAL_PLANNER_WITH_COVERAGE=ON
          -DVIRTUAL_PLANNER_WITH_HTTP=ON

      - name: Build
        run: cmake --build back-end/build-coverage

      - name: Test
        run: ctest --test-dir back-end/build-coverage --output-on-failure

      # --exclude tira os testes e as dependencias baixadas por FetchContent:
      # medir cobertura do proprio teste ou do httplib nao diz nada sobre o
      # codigo do projeto.
      - name: Generate coverage report
        run: |
          mkdir -p back-end/build-coverage/coverage
          gcovr \
            --root back-end \
            --exclude 'back-end/tests/' \
            --exclude '.*/_deps/.*' \
            --html-details back-end/build-coverage/coverage/index.html \
            --txt back-end/build-coverage/coverage/summary.txt \
            --print-summary \
            back-end/build-coverage

      # O numero fica visivel na aba de checks do PR, sem precisar baixar o
      # artefato. A issue pede visibilidade, nao um gate.
      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo '## Cobertura de testes do backend'
            echo
            echo '```'
            cat back-end/build-coverage/coverage/summary.txt
            echo '```'
            echo
            echo 'Meta minima acordada: ver docs/conventions.md.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        # v6 e a primeira major desta action em node24: v4 e v5 ainda
        # declaram node20 (verificado no action.yml de cada tag).
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: back-end/build-coverage/coverage/
          retention-days: 14

  postgres-integration:
    name: Build and test com PostgreSQL (migrations + integração real)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: virtual_planner
          POSTGRES_USER: virtual_planner
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virtual_planner -d virtual_planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciais do service container efêmero do CI. Não é segredo real: o
      # banco existe só durante o job e é descartado.
      #
      # O valor é deliberadamente distinto de qualquer default do repositório,
      # para que um `grep change-me` acuse configuração insegura de verdade e
      # não este job.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: virtual_planner
      POSTGRES_USER: virtual_planner
      POSTGRES_PASSWORD: ci-ephemeral-only
      VP_USE_POSTGRES: "true"
      # Mesma versão de libpqxx usada no desenvolvimento local.
      LIBPQXX_VERSION: "8.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # O adapter usa a API libpqxx 8.x: pqxx::params{transaction, ...},
      # result::one_row() e result::no_rows(). Essas APIs NÃO existem no
      # libpqxx-dev que o apt do Ubuntu fornece (7.x no Noble), então
      # `apt-get install libpqxx-dev` faria o build falhar aqui.
      # Por isso o libpqxx é compilado a partir do código-fonte, fixado na
      # mesma versão usada no desenvolvimento local (8.0.2), garantindo que
      # CI e máquina de dev exercitem exatamente a mesma API.
      # Se algum dia o adapter voltar a uma API compatível com o pacote do
      # apt, este passo pode ser trocado por `apt-get install libpqxx-dev`.
      - name: Install PostgreSQL client and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client cmake g++ python3

      - name: Cache libpqxx ${{ env.LIBPQXX_VERSION }}
        id: cache-libpqxx
        uses: actions/cache@v5
        with:
          path: /opt/libpqxx
          key: libpqxx-${{ env.LIBPQXX_VERSION }}-${{ runner.os }}-ubuntu-24.04

      - name: Build libpqxx ${{ env.LIBPQXX_VERSION }} from source
        if: steps.cache-libpqxx.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${LIBPQXX_VERSION}" \
            https://github.com/jtv/libpqxx.git /tmp/libpqxx
          cmake -S /tmp/libpqxx -B /tmp/libpqxx/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/libpqxx \
            -DBUILD_SHARED_LIBS=ON \
            -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx/build --parallel
          cmake --install /tmp/libpqxx/build

      - name: Expose libpqxx to the build
        run: |
          echo "CMAKE_PREFIX_PATH=/opt/libpqxx:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/libpqxx/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/opt/libpqxx/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure (Release, com PostgreSQL)
        run: >
          cmake -S back-end -B back-end/build
          -DCMAKE_BUILD_TYPE=Release
          -DVIRTUAL_PLANNER_WITH_POSTGRES=ON
          -DVIRTUAL_PLANNER_WITH_HTTP=ON

      - name: Build
        run: cmake --build back-end/build

      - name: Apply database migrations
        run: ./scripts/db-migrate.sh

      - name: Run tests (unitários + integração PostgreSQL real)
        run: ctest --test-dir back-end/build --output-on-failure

      - name: Smoke test HTTP com PostgreSQL
        env:
          VP_HTTP_HOST: 127.0.0.1
          VP_HTTP_PORT: "18080"
        run: |
          set -euo pipefail
          ./back-end/build/virtual_planner > /tmp/virtual-planner-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:18080/api/health > /dev/null; then
              break
            fi
            sleep 0.2
          done
          python3 scripts/smoke-api.py --base-url http://127.0.0.1:18080
