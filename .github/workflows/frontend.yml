name: Frontend CI

on:
  # push so em main: em branch de PR o gatilho pull_request ja cobre, e ter os
  # dois sem filtro de branch faz o mesmo commit rodar duas vezes (ver #76).
  push:
    branches:
      - main
    paths:
      - "front-end/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "front-end/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Mesma major usada em desenvolvimento local, para evitar divergencia
      # entre o que roda no CI e o que os devs testam na maquina.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front-end

      - name: Build
        run: npm run build
        working-directory: front-end

      - name: Lint
        run: npm run lint
        working-directory: front-end

      - name: Test
        run: npm test
        working-directory: front-end

      - name: Check formatting
        run: npm run format:check
        working-directory: front-end
